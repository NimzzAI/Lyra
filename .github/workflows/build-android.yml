name: Build Android (APK)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
      - '.github/scripts/android-smoke.sh'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect debug APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          cp "android/app/build/outputs/apk/debug/Lyra v${VERSION}.apk" "dist-assets/Lyra-v${VERSION}-Android.apk"

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_B64 != ''
        env:
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore
          (cd android && ./gradlew assembleRelease)
          cp "android/app/build/outputs/apk/release/Lyra v${VERSION}.apk" "dist-assets/Lyra-v${VERSION}-Android.apk"
          rm -f android/app/release.keystore

      - name: Warn about debug signing
        if: env.ANDROID_KEYSTORE_B64 == ''
        run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found. The APK is debug-signed, so each build has a different signature and cannot update an earlier install."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Android-APK
          path: dist-assets/*.apk

      - name: Upload release asset
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-android10:
    name: Smoke test on Android 10 (API 29)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Lyra-Android-APK
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Android10-Smoke
          path: smoke-android10.png
          if-no-files-found: ignore
